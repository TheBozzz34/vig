# The VM depends on vig-bytecode and, for its tests, on vig-assembler. Both are
# path dependencies, so this workflow checks out the three repositories side by
# side in the layout that a developer has locally.
#
# The suite runs on Linux as well as Windows. `src/foreign.zig` chooses its loader
# at compile time, and each job covers a different one: `LoadLibraryA` on Windows
# and `dlopen` on Linux. The two tests that name a library name themselves a
# library of the system that runs them and skip on the other, and the four example
# programs that need a Windows library are not in the corpus.
#
# Linux is the job that matters for a regression: a `kernel32` declaration that
# leaks back into a path any code can reach breaks that job and not the Windows
# one.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: vig

      - uses: actions/checkout@v4
        with:
          repository: TheBozzz34/vig-bytecode
          path: vig-bytecode

      # The tests assemble each example program and run it. Therefore the VM
      # needs the assembler and its `examples` directory, not only the shared
      # bytecode package.
      - uses: actions/checkout@v4
        with:
          repository: TheBozzz34/vig-assembler
          path: vig-assembler

      - name: Build All Targets
        run: bazel build //:vig

      - name: Test All Targets
        run: bazel test //:vig

      

